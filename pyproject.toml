[project]
name = "daily-investment-intelligence"
version = "0.1.0"
description = "개인 맞춤형 AI 투자 리서치 시스템 — 수집·분석·검색·리포트 생성 파이프라인"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "git-lsh", email = "bsagent1118@gmail.com" }]
dependencies = [
    "pydantic-settings>=2.7",
    "yfinance>=1.7.0",
]

[project.scripts]
dii = "dii.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dii"

# ---------------------------------------------------------------------------
# 린트 / 포매팅
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — import 정렬
    "B",        # bugbear — 흔한 버그 패턴
    "UP",       # pyupgrade — 구버전 문법 현대화
    "SIM",      # 불필요하게 복잡한 구문
    "RUF",      # ruff 자체 규칙
]

# ---------------------------------------------------------------------------
# 타입 체크
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
# 서드파티 라이브러리에 타입 스텁이 없어도 통과시킨다 (yfinance 등)
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# 테스트
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
