# 분석 유니버스 (초안)
#
# 이 파일은 파이프라인이 매일 수집·분석할 대상을 정의한다.
# 종목을 늘리고 줄이는 것은 이 파일만 고치면 되고, 코드는 건드리지 않는다.
#
# 선정 기준 (Project_Plan.md 5.0절):
#   - 섹터당 동일 개수를 둔다. 시가총액 가중으로 뽑으면 정보기술 섹터가 절반을 차지해
#     "어느 섹터가 강한가"를 비교하는 횡단면 분석이 성립하지 않는다.
#   - 섹터 안에서는 사업 모델이 서로 다른 종목을 고른다. 같은 업종만 넣으면
#     섹터 내 랭킹이 늘 비슷하게 나와 종목 선택 신호가 무의미해진다.
#   - 거래대금이 크고 상장 이력이 긴 종목으로 제한한다. 모멘텀·변동성 계산에
#     충분한 과거 데이터가 필요하고, 거래가 얇으면 지표에 잡음이 많다.

schema_version = 1

# 시장 전체 벤치마크. 개별 종목·섹터의 상대강도를 이 대비로 계산한다.
[benchmark]
ticker = "SPY"
name = "S&P 500"

# ---------------------------------------------------------------------------
# GICS 11개 섹터. etf 는 섹터 자체의 수익률을 재는 대용물(proxy)로 쓴다.
# ---------------------------------------------------------------------------

[[sectors]]
etf = "XLK"
name = "Information Technology"
name_ko = "정보기술"
tickers = ["AAPL", "MSFT", "NVDA", "CRM"]
note = "하드웨어 / 소프트웨어·클라우드 / 반도체 / SaaS 로 성격을 갈랐다"

[[sectors]]
